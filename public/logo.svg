<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Wrench — angled, with proper jaw cutout using clip-path -->
  <g transform="translate(18, 40) rotate(-30)">
    <!-- Handle -->
    <rect x="16" y="-5" width="38" height="10" rx="5" fill="url(#g)"/>
    <!-- Jaw head -->
    <path fill-rule="evenodd" fill="url(#g)"
      d="M0,-11 L0,11 L12,11 L12,8 L6,4 L6,-4 L12,-8 L12,-11 Z M4,-5 L4,5 L8,5 L8,-5 Z"/>
  </g>

  <!-- AUTOWNER -->
  <text x="72" y="54" font-family="'Russo One','Arial Black',sans-serif" font-size="40" fill="#f0f1f3" letter-spacing="4">
    AUTO<tspan fill="url(#g)">WNER</tspan>
  </text>
</svg>

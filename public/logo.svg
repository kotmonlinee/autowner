<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Crossed wrench + screwdriver -->
  <g transform="translate(14, 4)">
    <!-- Screwdriver — diagonal top-left to bottom-right -->
    <g transform="translate(40, 0) rotate(45)">
      <rect x="-3" y="-22" width="6" height="14" rx="2" fill="url(#gi)"/>
      <rect x="-4" y="-8" width="8" height="6" rx="1" fill="url(#gi)"/>
      <rect x="-2" y="14" width="4" height="16" rx="2" fill="url(#gi)"/>
    </g>
    <!-- Wrench — diagonal bottom-left to top-right -->
    <g transform="translate(40, 0) rotate(-45)">
      <rect x="-2" y="8" width="4" height="24" rx="2" fill="url(#g)"/>
      <circle cx="0" cy="6" r="8" fill="none" stroke="url(#g)" stroke-width="4"/>
      <rect x="-1" y="-2" width="2" height="8" rx="1" fill="url(#g)"/>
    </g>
  </g>

  <text x="76" y="54" font-family="'Russo One','Arial Black',sans-serif" font-size="40" fill="#f0f1f3" letter-spacing="4">
    AUTO<tspan fill="url(#g)">WNER</tspan>
  </text>
</svg>

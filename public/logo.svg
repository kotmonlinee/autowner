<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Gauge icon -->
  <g transform="translate(14, 6)">
    <!-- Outer arc -->
    <path d="M8,46 A28,28 0 0,1 48,46" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
    <!-- Tick marks -->
    <line x1="12" y1="42" x2="14" y2="36" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="18" x2="28" y2="14" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="36" x2="44" y2="42" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="28" y1="28" x2="20" y2="40" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="28" cy="28" r="4" fill="url(#g)"/>
  </g>

  <!-- AUTOWNER -->
  <text x="82" y="54" font-family="'Russo One','Arial Black',sans-serif" font-size="40" fill="#f0f1f3" letter-spacing="4">
    AUTO<tspan fill="url(#g)">WNER</tspan>
  </text>
</svg>
